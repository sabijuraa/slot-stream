version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: slot-stream-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: slot_stream
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - slot-stream-network

  slot-stream:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: slot-stream
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RUST_LOG: info
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/slot_stream
      GEYSER_ENDPOINT: ${GEYSER_ENDPOINT:-http://validator:10000}
      RPC_ENDPOINT: ${RPC_ENDPOINT:-https://api.mainnet-beta.solana.com}
    ports:
      - "8080:8080"
    networks:
      - slot-stream-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: slot-stream-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - slot-stream-network
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:10.1.0
    container_name: slot-stream-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - slot-stream-network
    profiles:
      - monitoring

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  slot-stream-network:
    driver: bridge
