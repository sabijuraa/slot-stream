[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/ingester",
    "crates/processor",
    "crates/persister",
    "crates/backfill",
    "crates/dlq",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/your-org/slot-stream"
rust-version = "1.88"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.36", features = ["full", "tracing"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
async-stream = "0.3"
async-trait = "0.1"

# gRPC
tonic = { version = "0.11", features = ["tls", "tls-roots"] }
prost = "0.12"
prost-types = "0.12"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "chrono", "uuid", "json", "migrate"] }
deadpool-postgres = "0.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
bs58 = "0.5"
sha2 = "0.10"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.22"
metrics-exporter-prometheus = "0.14"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.7", features = ["v4", "serde"] }
bytes = "1.5"
parking_lot = "0.12"
dashmap = "5.5"
crossbeam-channel = "0.5"
backoff = { version = "0.4", features = ["tokio"] }
config = "0.14"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
toml = "0.8"
dotenvy = "0.15"

# Testing
tokio-test = "0.4"
proptest = "1.4"
criterion = "0.5"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

[profile.bench]
lto = "thin"
