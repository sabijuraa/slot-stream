name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Format, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No toolchain is named here: rust-toolchain.toml pins 1.88 and this
      # action honours it, so the file stays the single source of truth.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # tonic-build shells out to protoc, so nothing in the workspace compiles
      # without it.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets --locked

  test:
    name: Test
    runs-on: ubuntu-latest

    # The integration tests are the point of this project, so they run for real
    # against PostgreSQL. Each creates and drops its own database, so the role
    # needs CREATEDB, which the default postgres superuser has.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Points at a database the tests may create others from, not at a test
      # database itself.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # No migration step: the pipeline applies its own migrations on startup,
      # and each integration test does the same against the database it creates.
      - name: Test
        run: cargo test --workspace --all-features

      - name: Install psql
        run: sudo apt-get install -y postgresql-client

      # The same crash proof that runs locally: the real binaries over a real
      # gRPC socket, killed with SIGKILL mid-stream and restarted.
      - name: Crash recovery, at the process level
        run: scripts/crash_recovery_proof.sh

  image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: slot-stream:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A built image that cannot start is not a passing build. The compose
      # stack itself is not exercised here: bringing up three networked
      # services and waiting for the chain to advance belongs in an
      # environment test, not in the image build.
      - name: The image contains runnable binaries
        run: |
          docker run --rm --entrypoint sh slot-stream:ci -c \
            'test -x /usr/local/bin/slot-stream && test -x /usr/local/bin/slot-stream-source'
